# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push: # Trigger CI on push to any branch
  pull_request:
    branches: [ master ] # Trigger CI on pull request targeting the master branch

jobs:
  build:

    runs-on: ubuntu-latest

    # Matrix strategy: 3.10 as baseline, 3.x automatically targets the latest stable Python release
    strategy:
      matrix:
        python-version: ["3.11", "3.x"] # 'gurita' requires a different Python: 3.10.22 not in '>=3.11'

    steps:
    - uses: actions/checkout@v4 # Upgraded to latest version for stability and Node.js runtime support
    
    - name: Set up Python ${{ matrix.python-version }} # Dynamically load Python versions from matrix
      uses: actions/setup-python@v5 # Upgraded to v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -e . # Install gurita in editable mode to register CLI executable
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest
        
    - name: Save testing outputs as artifacts
      if: always()
      uses: actions/upload-artifact@v4 # Upgraded to v4
      with:
        name: test_outputs
        path: test/outputs 
